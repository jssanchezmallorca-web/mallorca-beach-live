<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06131a"><meta name="description" content="Webcams en directo de playas y calas de Mallorca"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><link rel="apple-touch-icon" href="./icon.svg"><title>Mallorca Beach Live</title><style>:root{--bg:#06131a;--card:#0b222c;--line:#1d4251;--text:#f4fbff;--muted:#9bb7c2;--accent:#50d5ff;--live:#ff4358}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button,input{font:inherit}button{cursor:pointer}header{position:sticky;top:0;z-index:20;background:#06131af2;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:12px}.top{display:flex;align-items:center;gap:10px}.logo{font-size:28px}.title{flex:1}.title h1{font-size:19px;margin:0}.title p{font-size:11px;color:var(--muted);margin:3px 0 0}.actions{display:flex;gap:6px}.btn{border:1px solid var(--line);background:#0e2c38;color:#fff;border-radius:9px;padding:8px 10px;font-size:12px;text-decoration:none}.toolbar{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:9px}.search{border:1px solid var(--line);background:#081d26;color:#fff;border-radius:10px;padding:10px}.count{align-self:center;font-size:11px;color:var(--muted)}.filters{display:flex;gap:6px;overflow:auto;margin-top:8px}.chip{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:#dcebf1;border-radius:999px;padding:7px 10px;font-size:11px}.chip.on{border-color:var(--accent);background:#103442}main{padding:10px}.notice{border:1px solid #215366;background:#092631;border-radius:11px;padding:9px 11px;margin-bottom:10px;font-size:11px;color:#cfe8f1}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}.visual{position:relative;aspect-ratio:16/10;background:radial-gradient(circle at 65% 20%,#1e6275,#071923 75%);overflow:hidden}.visual img{width:100%;height:100%;object-fit:cover}.ph{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:10px;color:#c9e5ef}.ph b{font-size:12px}.live,.prov{position:absolute;top:6px;border-radius:5px;padding:4px 6px;font-size:8px}.live{left:6px;background:var(--live);font-weight:800}.prov{right:6px;background:#000a;max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.play{position:absolute;inset:0;border:0;background:linear-gradient(transparent 55%,#0008)}.play:after{content:'▶';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#000a;color:white}.fav{position:absolute;right:6px;bottom:6px;z-index:3;width:32px;height:32px;border-radius:50%;border:1px solid #ffffff40;background:#06131acc;color:#fff}.fav.on{color:#ffd45f}.info{padding:8px}.name{font-size:12px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{display:flex;justify-content:space-between;margin-top:4px;font-size:9px;color:var(--muted)}.modal,.mosaic{position:fixed;inset:0;z-index:100;background:#000;display:none;flex-direction:column}.modal.open,.mosaic.open{display:flex}.bar{min-height:50px;background:#06131a;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:6px}.bar .ttl{flex:1;font-size:12px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.viewer{flex:1;min-height:0;display:grid;place-items:center}.viewer iframe,.viewer img{width:100%;height:100%;border:0;object-fit:contain}.external{max-width:520px;text-align:center;padding:22px}.external p{color:var(--muted);font-size:12px}.mgrid{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:5px;padding:5px}.mcell{position:relative;min-width:0;min-height:0;background:#06131a;overflow:hidden}.mcell iframe,.mcell img{width:100%;height:100%;border:0;object-fit:contain}.label{position:absolute;left:4px;bottom:4px;background:#000b;padding:4px 6px;font-size:8px;border-radius:4px}.foot{padding:18px 8px 60px;text-align:center;color:#7896a2;font-size:9px}@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}@media(min-width:1050px){.grid{grid-template-columns:repeat(4,1fr)}}</style></head><body><header><div class="top"><div class="logo">🏝️</div><div class="title"><h1>Mallorca Beach Live</h1><p><b id="total">40</b> directos de playa/cala · verificados 25/08/2026</p></div><div class="actions"><button class="btn" id="mosaicBtn">▦ Mosaico</button><button class="btn" id="installBtn" hidden>＋ Instalar</button></div></div><div class="toolbar"><input id="search" class="search" type="search" placeholder="Buscar playa o cala…"><div class="count" id="count"></div></div><div class="filters" id="filters"></div></header><main><div class="notice">✓ Solo playas/calas. Las miniaturas son ligeras; el vídeo se carga al tocar una cámara.</div><section class="grid" id="grid"></section><div class="foot">Mallorca Beach Live v2.0 · Las emisiones pertenecen a sus proveedores originales.</div></main><div class="modal" id="modal"><div class="bar"><div class="ttl" id="modalTitle"></div><button class="btn" id="fs">⛶</button><a class="btn" id="original" target="_blank" rel="noopener">Original ↗</a><button class="btn" id="close">✕</button></div><div class="viewer" id="viewer"></div></div><div class="mosaic" id="mosaic"><div class="bar"><div class="ttl">Mosaico LIVE · hasta 4 favoritas</div><button class="btn" id="closeMosaic">✕ Cerrar</button></div><div class="mgrid" id="mgrid"></div></div><script src="./cameras.js"></script><script>const $=s=>document.querySelector(s),state={region:'Todas',q:'',favOnly:false,prompt:null},favs=new Set(JSON.parse(localStorage.getItem('mbl-favs')||'[]')),regions=['Todas','Norte','Llevant','Ponent','Palma','Migjorn'];const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function thumb(c){return c.mode==='youtube'?`https://i.ytimg.com/vi/${c.video}/hqdefault.jpg`:c.mode==='ipcam'?`https://g0.ipcamlive.com/player/snapshot.php?alias=${c.alias}&t=${Math.floor(Date.now()/300000)}`:''}function filtered(){let q=state.q.toLowerCase().trim();return CAMERAS.filter(c=>(state.region==='Todas'||c.region===state.region)&&(!state.favOnly||favs.has(c.key))&&(!q||`${c.name} ${c.region} ${c.provider}`.toLowerCase().includes(q)))}function save(){localStorage.setItem('mbl-favs',JSON.stringify([...favs]))}function drawFilters(){let e=$('#filters');e.innerHTML='';regions.forEach(r=>{let b=document.createElement('button');b.className='chip'+(state.region===r&&!state.favOnly?' on':'');b.textContent=r;b.onclick=()=>{state.region=r;state.favOnly=false;drawFilters();render()};e.appendChild(b)});let f=document.createElement('button');f.className='chip'+(state.favOnly?' on':'');f.textContent='★ Favoritas';f.onclick=()=>{state.favOnly=!state.favOnly;drawFilters();render()};e.appendChild(f)}function render(){let list=filtered(),g=$('#grid');$('#count').textContent=`${list.length} / ${CAMERAS.length}`;g.innerHTML='';for(const c of list){let card=document.createElement('article');card.className='card';let v=document.createElement('div');v.className='visual';let t=thumb(c);if(t){let i=document.createElement('img');i.loading='lazy';i.decoding='async';i.src=t;i.alt=c.name;i.onerror=()=>{i.remove();v.insertAdjacentHTML('afterbegin',`<div class="ph"><div>🌊<br><b>${esc(c.name)}</b></div></div>`)};v.appendChild(i)}else v.innerHTML=`<div class="ph"><div>🌊<br><b>${esc(c.name)}</b></div></div>`;v.insertAdjacentHTML('beforeend',`<span class="live">● DIRECTO</span><span class="prov">${esc(c.provider)}</span>`);let p=document.createElement('button');p.className='play';p.onclick=()=>openCam(c);v.appendChild(p);let f=document.createElement('button');f.className='fav'+(favs.has(c.key)?' on':'');f.textContent=favs.has(c.key)?'★':'☆';f.onclick=e=>{e.stopPropagation();favs.has(c.key)?favs.delete(c.key):favs.add(c.key);save();render()};v.appendChild(f);let inf=document.createElement('div');inf.className='info';inf.innerHTML=`<div class="name">${esc(c.name)}</div><div class="meta"><span>${esc(c.region)}</span><span>✓ ${esc(c.verified)}</span></div>`;card.append(v,inf);g.appendChild(card)}}function node(c){if(c.mode==='youtube'||c.mode==='ipcam'){let f=document.createElement('iframe');f.src=c.mode==='youtube'?`https://www.youtube-nocookie.com/embed/${c.video}?autoplay=1&playsinline=1&rel=0`:`https://g0.ipcamlive.com/player/player.php?alias=${c.alias}&autoplay=1`;f.allow='autoplay; encrypted-media; picture-in-picture; fullscreen';f.allowFullscreen=true;return f}if(c.mode==='mjpeg'){let i=document.createElement('img');i.src=c.url;return i}let d=document.createElement('div');d.className='external';d.innerHTML=`<h2>${esc(c.name)}</h2><p>Este proveedor no permite una incrustación fiable. Abre la emisión original para evitar una pantalla negra.</p><a class="btn" target="_blank" rel="noopener" href="${esc(c.url)}">Abrir directo ↗</a>`;return d}function openCam(c){$('#modalTitle').textContent=c.name;$('#original').href=c.url;let v=$('#viewer');v.innerHTML='';v.appendChild(node(c));$('#modal').classList.add('open');document.body.style.overflow='hidden'}function closeCam(){$('#modal').classList.remove('open');$('#viewer').innerHTML='';document.body.style.overflow=''}function openMosaic(){let list=[...favs].map(k=>CAMERAS.find(c=>c.key===k)).filter(Boolean).slice(0,4);if(!list.length)list=filtered().slice(0,4);let g=$('#mgrid');g.innerHTML='';for(const c of list){let d=document.createElement('div');d.className='mcell';d.appendChild(node(c));d.insertAdjacentHTML('beforeend',`<span class="label">${esc(c.name)}</span>`);g.appendChild(d)}while(g.children.length<4){let d=document.createElement('div');d.className='mcell';d.innerHTML='<div class="ph">Marca cámaras con ☆ para elegirlas.</div>';g.appendChild(d)}$('#mosaic').classList.add('open');document.body.style.overflow='hidden'}$('#search').oninput=e=>{state.q=e.target.value;render()};$('#close').onclick=closeCam;$('#fs').onclick=()=>$('#viewer').requestFullscreen?.();$('#mosaicBtn').onclick=openMosaic;$('#closeMosaic').onclick=()=>{$('#mosaic').classList.remove('open');$('#mgrid').innerHTML='';document.body.style.overflow=''};window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();state.prompt=e;$('#installBtn').hidden=false});$('#installBtn').onclick=async()=>{if(state.prompt){state.prompt.prompt();await state.prompt.userChoice;state.prompt=null;$('#installBtn').hidden=true}};if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});$('#total').textContent=CAMERAS.length;drawFilters();render();</script></body></html>
