<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06131a"><meta name="description" content="Prueba aislada de instalación PWA de BEACH CAM CAMPER"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png"><link rel="apple-touch-icon" href="./icon-512.png"><title>BEACH CAM CAMPER · PWA TEST</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#06131a;color:#fff;font-family:system-ui}.card{max-width:420px;margin:20px;padding:28px;border:1px solid #24505d;border-radius:24px;text-align:center;background:#0b222c}.icon{width:120px;height:120px;border-radius:28px}.btn{display:block;width:100%;box-sizing:border-box;margin-top:18px;padding:15px;border:0;border-radius:14px;background:#0b89a8;color:#fff;font-size:18px;font-weight:800}.ok{color:#bfffe0;margin-top:16px}.muted{color:#9bb7c2;font-size:13px}</style></head><body><main class="card"><img class="icon" src="./icon-512.png" alt="BCC"><h1>BEACH CAM CAMPER</h1><p>Prueba aislada de instalación Android</p><button class="btn" id="install" disabled>Preparando instalación…</button><div class="ok" id="state">Comprobando manifest y service worker…</div><p class="muted">Esta página no modifica la app BCC actual.</p></main><script>let promptEvent=null;const b=document.getElementById('install'),s=document.getElementById('state');window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();promptEvent=e;b.disabled=false;b.textContent='Instalar BEACH CAM CAMPER';s.textContent='✓ Chrome confirma que esta PWA es instalable';});b.onclick=async()=>{if(!promptEvent)return;promptEvent.prompt();const r=await promptEvent.userChoice;s.textContent=r.outcome==='accepted'?'Instalación aceptada. Espera a que Android termine.':'Instalación cancelada.';promptEvent=null};window.addEventListener('appinstalled',()=>{b.disabled=true;b.textContent='Instalada';s.textContent='✓ WebAPK instalado correctamente';});if('serviceWorker'in navigator){navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(()=>navigator.serviceWorker.ready).then(()=>{if(!promptEvent)s.textContent='Service worker listo; esperando confirmación de Chrome…'}).catch(e=>{s.textContent='ERROR service worker: '+e.message})}else{s.textContent='ERROR: service worker no disponible'}</script></body></html>
