name: Build BEACH CAM CAMPER APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-bcc/**'
      - 'family/share-icon.png'
      - '.github/workflows/build-bcc-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare launcher icon
        run: |
          mkdir -p android-bcc/app/src/main/res/drawable
          cp family/share-icon.png android-bcc/app/src/main/res/drawable/app_icon.png

      - name: Build real Android APK
        working-directory: android-bcc
        run: gradle --no-daemon assembleDebug

      - name: Publish APK file
        run: |
          mkdir -p downloads
          cp android-bcc/app/build/outputs/apk/debug/app-debug.apk downloads/BEACH-CAM-CAMPER.apk
          ls -lh downloads/BEACH-CAM-CAMPER.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BEACH-CAM-CAMPER-APK
          path: downloads/BEACH-CAM-CAMPER.apk
          if-no-files-found: error

      - name: Commit APK for direct download
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/BEACH-CAM-CAMPER.apk
          if git diff --cached --quiet; then
            echo 'APK unchanged'
          else
            git commit -m 'Build BEACH CAM CAMPER Android APK [skip ci]'
            git push
          fi
