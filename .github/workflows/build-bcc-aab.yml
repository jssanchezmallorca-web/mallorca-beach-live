name: Build BEACH CAM CAMPER Google Play AAB

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-bcc/**'
      - '.github/workflows/build-bcc-aab.yml'

jobs:
  build-aab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build unsigned Google Play bundle
        working-directory: android-bcc
        run: gradle --no-daemon bundleRelease

      - name: Verify bundle exists
        run: |
          test -s android-bcc/app/build/outputs/bundle/release/app-release.aab
          ls -lh android-bcc/app/build/outputs/bundle/release/app-release.aab

      - name: Upload unsigned AAB
        uses: actions/upload-artifact@v4
        with:
          name: BCC-1.0.2-UNSIGNED-AAB
          path: android-bcc/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
