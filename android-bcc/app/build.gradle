plugins {
    id 'com.android.application'
}

android {
    namespace 'com.beachcamcamper.mallorca'
    compileSdk 35

    defaultConfig {
        applicationId 'com.beachcamcamper.mallorca'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.0.1'
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('BCC_KEYSTORE') ?: '../bcc-release.jks')
            storePassword System.getenv('BCC_STORE_PASSWORD') ?: 'BeachCamCamper2026!'
            keyAlias System.getenv('BCC_KEY_ALIAS') ?: 'beachcamcamper'
            keyPassword System.getenv('BCC_KEY_PASSWORD') ?: 'BeachCamCamper2026!'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
}
