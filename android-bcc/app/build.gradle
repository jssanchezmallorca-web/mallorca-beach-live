plugins {
    id 'com.android.application'
}

def releaseKeystore = System.getenv('BCC_KEYSTORE')

android {
    namespace 'com.beachcamcamper.mallorca'
    compileSdk 35

    defaultConfig {
        applicationId 'com.beachcamcamper.mallorca'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '1.0.2'
    }

    signingConfigs {
        if (releaseKeystore) {
            release {
                storeFile file(releaseKeystore)
                storePassword System.getenv('BCC_STORE_PASSWORD')
                keyAlias System.getenv('BCC_KEY_ALIAS')
                keyPassword System.getenv('BCC_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (releaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }
}
